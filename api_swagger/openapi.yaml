            type: array
            items: {type: string}
        retryAfterSeconds: {type: integer, minimum: 0}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    ExpenseCreate:
      type: object
      required: [amount, currency, description, date]
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, example: UAH}
        description: {type: string, minLength: 1, maxLength: 500}
        date: {type: string, format: date}
        categoryId: {type: string, format: uuid, nullable: true}
    ExpenseUpdate:
      type: object
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        description: {type: string, minLength: 1, maxLength: 500}
        date: {type: string, format: date}
        categoryId: {type: string, format: uuid, nullable: true}
    NaturalText:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 3, maxLength: 2000}
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        color: {type: string, default: '#4F46E5'}
    Category:
      type: object
      required: [id, name, color]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 80}
        color: {type: string, default: '#4F46E5'}
    CategoryDeleteResult:
      type: object
      required: [message]
      properties:
        message: {type: string, example: Category deleted successfully}
  responses:
    BadRequest:
      description: Некоректний формат запиту
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Відсутній або недійсний токен
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Доступ заборонено
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Конфлікт із поточним станом ресурсу
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Дані не пройшли перевірку
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimit:
      description: Перевищено ліміт запитів
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Внутрішня помилка сервера
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: AI-сервіс або інша залежність тимчасово недоступна
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
