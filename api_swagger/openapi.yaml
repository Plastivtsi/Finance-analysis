openapi: 3.0.3
info:
  title: Smart Spend Tracker API
  version: 1.0.0
  description: Початкова специфікація API. Реальні автентифікація, база даних та AI потребують окремої реалізації.
servers:
  - url: http://localhost:8000
tags:
  - name: Auth
  - name: Expenses
  - name: Categories
  - name: Analytics
security:
  - BearerAuth: []
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Реєстрація користувача
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Користувача зареєстровано}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вхід у систему
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Токен доступу}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/expenses:
    get:
      tags: [Expenses]
      summary: Отримати список витрат
      parameters:
        - {in: query, name: dateFrom, schema: {type: string, format: date}}
        - {in: query, name: dateTo, schema: {type: string, format: date}}
        - {in: query, name: categoryId, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Список витрат}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Expenses]
      summary: Створити витрату вручну
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpenseCreate'}
      responses:
        '201': {description: Витрату створено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/expenses/natural-language:
    post:
      tags: [Expenses]
      summary: Розпізнати витрату з тексту за допомогою AI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NaturalText'}
      responses:
        '201': {description: Витрату розпізнано}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/expenses/{expenseId}:
    parameters:
      - {in: path, name: expenseId, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Expenses]
      summary: Отримати витрату
      responses:
        '200': {description: Витрата}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Expenses]
      summary: Оновити витрату
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpenseUpdate'}
      responses:
        '200': {description: Витрату оновлено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Expenses]
      summary: Видалити витрату
      responses:
        '204': {description: Витрату видалено}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/categories:
    get:
      tags: [Categories]
      summary: Отримати категорії
      responses:
        '200': {description: Список категорій}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Categories]
      summary: Створити категорію
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryCreate'}
      responses:
        '201': {description: Категорію створено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/analytics/summary:
    get:
      tags: [Analytics]
      summary: Загальна статистика витрат
      parameters:
        - {in: query, name: dateFrom, schema: {type: string, format: date}}
        - {in: query, name: dateTo, schema: {type: string, format: date}}
      responses:
        '200': {description: Загальна статистика}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/analytics/by-category:
    get:
      tags: [Analytics]
      summary: Статистика витрат за категоріями
      responses:
        '200': {description: Статистика за категоріями}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/expenses/{expenseId}/classify:
    parameters:
      - {in: path, name: expenseId, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Expenses]
      summary: Запустити AI-класифікацію витрати
      responses:
        '200': {description: Результат класифікації}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, instance, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        traceId: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        retryAfterSeconds: {type: integer, minimum: 0}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    ExpenseCreate:
      type: object
      required: [amount, currency, description, date]
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, example: UAH}
        description: {type: string, minLength: 1, maxLength: 500}
        date: {type: string, format: date}
        categoryId: {type: string, format: uuid, nullable: true}
    ExpenseUpdate:
      type: object
      properties:
        amount: {type: number, exclusiveMinimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        description: {type: string, minLength: 1, maxLength: 500}
        date: {type: string, format: date}
        categoryId: {type: string, format: uuid, nullable: true}
    NaturalText:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 3, maxLength: 2000}
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        color: {type: string}
  responses:
    BadRequest:
      description: Некоректний формат запиту
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Відсутній або недійсний токен
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Доступ заборонено
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Конфлікт із поточним станом ресурсу
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Дані не пройшли перевірку
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimit:
      description: Перевищено ліміт запитів
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Внутрішня помилка сервера
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: AI-сервіс або інша залежність тимчасово недоступна
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
